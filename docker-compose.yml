# Production (Dokploy): attach the domain missionmemory.kenaff.com to service `web`, port 80.
# `mcp` gets no domain; it is reached only through web's /mcp proxy.
services:
  web:
    build: ./web
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - mcp

  mcp:
    build: ./mcp
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://missionmemory.kenaff.com}
      WEB_INTERNAL_URL: http://web
    expose:
      - "3001"
