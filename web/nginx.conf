# One public origin (missionmemory.kenaff.com): static app + data + media, and /mcp proxied to the private mcp service.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Resolve the mcp service at request time so nginx starts even if mcp is not up yet.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $mcp_upstream http://missionmemory-mcp:3001;

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"ok":true}';
  }

  # Exact match: a prefix match would also capture /mcp-app.html.
  location = /mcp {
    proxy_pass $mcp_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Streamable HTTP may stream responses: never buffer.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
  }

  location /data/ {
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location /media/ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The chrome-less player may be framed by MCP hosts and other sites.
  # Serve index.html from this location (not an internal redirect to `/`) so these headers apply.
  location /embed/ {
    add_header Content-Security-Policy "frame-ancestors *" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files /index.html =404;
  }

  location / {
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
  }
}
